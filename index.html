<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>風城自由｜新竹公共事務資料整理</title>
  <meta name="description" content="從公開資料查看新竹市長施政、議員問政與里長背景，核對來源後再做判斷。">
  <link rel="canonical" href="https://windcityfreedom-creator.github.io/">
  <style>
    :root{font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;color:#222b39;background:#f4f1ec}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:flex;flex-direction:column}
    header{background:#222b39;color:white;padding:18px max(24px,calc((100vw - 1080px)/2));font-weight:800;letter-spacing:.08em}
    main{width:min(calc(100% - 40px),1080px);margin:auto; padding:70px 0 90px}
    .eyebrow{display:inline-block;background:#9d5364;padding:8px 14px;font-size:.85rem;font-weight:800}
    h1{font-family:Georgia,"Noto Serif TC",serif;font-size:clamp(3rem,8vw,6.5rem);line-height:1.08;letter-spacing:-.06em;margin:24px 0}
    p{font-size:clamp(1rem,2vw,1.25rem);line-height:1.8;max-width:650px;color:#4e5764}
    a{display:inline-block;margin-top:22px;padding:14px 22px;border-radius:2px;background:#222b39;color:white;text-decoration:none;font-weight:800}
    a:hover{background:#285a83}
    a:focus-visible{outline:3px solid #9d5364;outline-offset:4px}
    footer{padding:20px 24px;text-align:center;color:#5d6470;font-size:.9rem}
    @media(max-width:600px){
      header{padding:16px 20px}
      header small{display:block;font-size:.7rem;letter-spacing:.06em;margin-top:4px}
      main{padding:48px 0 56px}
      h1{font-family:Georgia,"Noto Serif TC",serif;font-size:clamp(2.7rem,12vw,4rem);margin:20px 0}
      p{font-size:1rem;line-height:1.7}
      a{display:block;width:100%;text-align:center;padding:15px 18px}
      footer{padding:16px 20px}
    }
  </style>
</head>
<body>
  <header>風城自由 <small>HSINCHU · 公共紀錄</small></header>
  <main>
    <span class="eyebrow">新竹公共事務資料整理</span>
    <h1>看見紀錄，<br>再做判斷。</h1>
    <p>整理市長施政、議員問政與里長背景。資料主要來自新竹市政府與市議會公開資料；請循來源核對，內容可能有誤或尚待補充。</p>
    <a href="/2026/">進入 2026 資料站 →</a>
  </main>
  <footer>公開資料整理與分析，不代表任何政府機關立場。</footer>
</body>
</html>
